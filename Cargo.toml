[package]
name = "run"
version = "0.3.2"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pane's Rust SDK, from crates.io.
pane-extension = "0.2"
# The package's preferences, read through the SDK with serde's no_std
# form: the shell "Run in Terminal" opens the command line in.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
# As Pane's own guests workspace builds its components: a small component,
# with no unwinding to carry into the WebAssembly component.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
